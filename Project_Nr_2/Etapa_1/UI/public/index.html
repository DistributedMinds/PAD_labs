<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistributedMinds Music</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231ed760'/%3E%3Cpath d='M9 19v-6M13 22V10M17 20v-8M21 23V9M25 18v-4' stroke='%23000' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <nav class="panel nav-panel">
        <a class="brand" href="#/home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">DistributedMinds<small>Music</small></span>
        </a>
        <a class="nav-link" data-nav="home" href="#/home"><i data-icon="home"></i><span>Acasă</span></a>
        <a class="nav-link" data-nav="search" href="#/search"><i data-icon="search"></i><span>Caută</span></a>
        <a class="nav-link" data-nav="cluster" href="#/cluster"><i data-icon="server"></i><span>Cluster</span></a>
      </nav>

      <section class="panel library-panel">
        <header class="library-head">
          <a class="library-title" href="#/library"><i data-icon="library"></i><span>Biblioteca ta</span></a>
          <button class="icon-btn" data-action="create" title="Adaugă o melodie"><i data-icon="plus"></i></button>
        </header>
        <div class="chips" id="library-chips">
          <button class="chip" data-filter="all">Tot</button>
          <button class="chip" data-filter="playlists">Playlisturi</button>
          <button class="chip" data-filter="artists">Artiști</button>
        </div>
        <ul class="library-list" id="library-list"></ul>
      </section>
    </aside>

    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <div class="history-btns">
          <button class="round-btn" data-action="back" title="Înapoi"><i data-icon="chevron-left"></i></button>
          <button class="round-btn" data-action="forward" title="Înainte"><i data-icon="chevron-right"></i></button>
        </div>
        <label class="search-box" id="search-box">
          <i data-icon="search"></i>
          <input id="search-input" type="search" placeholder="Ce vrei să asculți?" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>
        <div class="topbar-right">
          <div class="source-switch" id="source-switch" role="radiogroup" aria-label="Sursa datelor"></div>
          <button class="round-btn" data-action="refresh" title="Reîncarcă datele"><i data-icon="refresh"></i></button>
          <button class="pill-btn light" data-action="create"><i data-icon="plus"></i><span>Adaugă melodie</span></button>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>

    <footer class="player" id="player"></footer>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
