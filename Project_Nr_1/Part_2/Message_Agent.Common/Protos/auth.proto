syntax = "proto3";

option csharp_namespace = "GrpcAgent";

package GrpcAgent;

service Authenticator {
  rpc SignUp (AuthRequest) returns (AuthReply);
  rpc SignIn (AuthRequest) returns (AuthReply);
}

message AuthRequest {
  string username = 1;
  string password = 2;
  string address = 3;   // adresa Receiver-ului, pentru notific?ri
}

message AuthReply {
  bool success = 1;
  string info = 2;
  string token = 3;
  repeated string topics = 4;   // topicurile restaurate la sign in
}