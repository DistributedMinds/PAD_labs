syntax = "proto3";

option csharp_namespace = "GrpcAgent";

package GrpcAgent;

service Subscriber {
  rpc Subscribe (SubscribeRequest) returns (SubscribeReply);
  rpc Unsubscribe (SubscribeRequest) returns (SubscribeReply);
}

message SubscribeRequest {
  string topic = 1;
  string address = 2;
}

message SubscribeReply {
  bool success = 1;
  string info = 2;
}


